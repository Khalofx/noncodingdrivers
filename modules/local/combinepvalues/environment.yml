---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Versions tested against the release tables (combination_check.R, 2026-10-06).
# ACAT 0.91 has no conda package: -profile conda needs --skip_acat true until an r-acat
# recipe is merged into conda-forge (staged-recipes submission is a Step 7 task).
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::bioconductor-empiricalbrownsmethod=1.34.0
  - conda-forge::r-base=4.4.3
  - conda-forge::r-robustrankaggreg=1.2.1
