# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "cohort_filter"
description: Sample filters applied once to the cohort mutation table, before every caller - one sample per donor when donor information is given, then hypermutated samples (IntOGen rule by default; cap or none) - with the removed samples and rows published
keywords:
  - hypermutator
  - cohort
  - noncoding
tools:
  - "filter_hypermutators.py":
      description: "Pipeline-owned script (bin/filter_hypermutators.py)"
      homepage: "https://github.com/Khalofx/noncodingdrivers"
      documentation: "https://github.com/Khalofx/noncodingdrivers"
      tool_dev_url: "https://github.com/Khalofx/noncodingdrivers"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Cohort meta map
    - mutations:
        type: file
        description: Deduplicated cohort mutation table (sample chrom pos ref alt vtype)
        pattern: "*.tsv"
        ontologies: []
    - sheet_donors:
        type: file
        description: Donors of the cohort's samplesheet rows (TSV sample, donor), or []
        pattern: "*.tsv"
        ontologies: []
  - donor_map:
      type: file
      description: Donor map of --donor_map (TSV sample, donor), or []
      pattern: "*.tsv"
      ontologies: []

output:
  mutations:
    - - meta:
          type: map
          description: Cohort meta map
      - ${prefix}.mutations.tsv:
          type: file
          description: Rows of the kept samples, header and input order preserved; the table every caller reads
          pattern: "*.mutations.tsv"
          ontologies: []
  sample_filter:
    - - meta:
          type: map
          description: Cohort meta map
      - ${prefix}.sample_filter.tsv:
          type: file
          description: One row per sample with its donor, mutation count, kept (true/false), removed_by (donor or hypermutator), the reason and the cohort thresholds (Q1, Q3, IQR threshold)
          pattern: "*.sample_filter.tsv"
          ontologies: []
  removed:
    - - meta:
          type: map
          description: Cohort meta map
      - ${prefix}.removed_mutations.tsv:
          type: file
          description: Rows of the removed samples (header only when none)
          pattern: "*.removed_mutations.tsv"
          ontologies: []
  mqc:
    - - meta:
          type: map
          description: Cohort meta map
      - ${prefix}.sample_filter_mqc.tsv:
          type: file
          description: MultiQC custom-content table, one row per cohort
          pattern: "*_mqc.tsv"
          ontologies: []
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python3 --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python3 --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Khalofx"
maintainers:
  - "@Khalofx"
