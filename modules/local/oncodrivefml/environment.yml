---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Documentation of the runtime only: OncodriveFML and bgdata have no Bioconda or conda-forge
# package, so the module has no conda directive and `-profile conda` is not supported for it.
# The image (containers/oncodrivefml) carries oncodrivefml 2.5.0 on python 3.11.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11
