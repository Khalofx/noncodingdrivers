---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Documentation of the runtime only: MutEnricher has no Bioconda or conda-forge package, so the
# module has no conda directive and `-profile conda` is not supported for it. The image
# (containers/mutenricher) carries MutEnricher 1.3.3 on python 3.7 with htslib 1.21.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.7
