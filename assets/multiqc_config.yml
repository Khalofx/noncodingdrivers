report_comment: >
  This report has been generated by the <a href="https://github.com/khalofx/noncodingdrivers/tree/dev" target="_blank">khalofx/noncodingdrivers</a>
  analysis pipeline.
report_section_order:
  "khalofx-noncodingdrivers-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "khalofx-noncodingdrivers-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Optional SigProfiler QC (--run_sigprofiler): COSMIC SBS96 signature activities per sample.
# Cohort-level QC only; no element filter or score uses them.
custom_data:
  sigprofiler_sbs96_activities:
    file_format: "tsv"
    section_name: "SigProfiler SBS96 activities"
    description: "Mutations attributed to each COSMIC SBS signature per sample (SigProfilerExtractor, decomposed to COSMIC). Cohort-level QC: no element filter or score uses these values."
    plot_type: "bargraph"
    pconfig:
      id: "sigprofiler_sbs96_activities_plot"
      title: "SigProfiler: COSMIC SBS96 activities"
      ylab: "Mutations"
sp:
  sigprofiler_sbs96_activities:
    fn: "COSMIC_SBS96_Activities.txt"
