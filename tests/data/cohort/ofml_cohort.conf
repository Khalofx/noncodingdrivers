[genome]
build = 'hg38'

[signature]
method = 'none'

[score]
file = "hg38_scores.tsv.gz"
format = 'tabix'
chr = 0
chr_prefix = ''
pos = 1
ref = 2
alt = 3
score = 4

[statistic]
method = 'amean'
sampling = 100000
sampling_max = 1000000
sampling_chunk = 100
sampling_min_obs = 10

    [[indels]]
    include = False

[settings]
cores = 1
seed = 123
