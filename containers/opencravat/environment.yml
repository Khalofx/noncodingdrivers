# Conda part of the noncodingdrivers OpenCRAVAT image: the interpreter, gawk for the format
# adapters, and procps for Nextflow's task metrics. open-cravat itself and its Python
# dependencies come from PyPI (pip-lock.txt, exact versions and hashes).
channels:
  - conda-forge
dependencies:
  - conda-forge::python=3.11
  - conda-forge::pip
  - conda-forge::gawk=5.3.1
  - conda-forge::procps-ng
