repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    # copyright holder set to the author, not the template's team line (build guide Step 1.4)
    - LICENSE
    - CODE_OF_CONDUCT.md
    - assets/nf-core-noncodingdrivers_logo_light.png
    - docs/images/nf-core-noncodingdrivers_logo_light.png
    - docs/images/nf-core-noncodingdrivers_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  nf_test_content:
    # assembly gates: every test stops the run before a versions.yml is written
    - tests/assembly_mismatch.nf.test
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-noncodingdrivers_logo_light.png
    - docs/images/nf-core-noncodingdrivers_logo_light.png
    - docs/images/nf-core-noncodingdrivers_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: khalofx
  name: noncodingdrivers
  description: Cohort-level discovery and explanation of candidate non-coding regulatory
    driver elements from pre-called somatic variants
  author: Khalifa Juma
  version: 1.0.0dev
  force: false
  outdir: .
  skip_features:
    - fastqc
    - igenomes
    - gpu
  is_nfcore: false
